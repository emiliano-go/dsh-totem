# Local SearXNG for the dsh-totem research stack.
#
#   cd deploy/searxng
#   printf 'SEARXNG_SECRET=%s\n' "$(openssl rand -hex 32)" > .env
#   docker compose up -d
#
# The container listens on 127.0.0.1:8888 only. Point SEARXNG_URL at a remote
# instance instead (for example one hosted on solsticio) if you prefer.

name: dsh-research

services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: dsh-searxng
    restart: unless-stopped
    # Host networking avoids Docker's embedded DNS on user-defined bridges,
    # which cannot resolve names on hosts whose systemd-resolved stub listens
    # on 127.0.0.53. The bind address below keeps the port loopback-only.
    network_mode: host
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Create deploy/searxng/.env with a random SEARXNG_SECRET}
      SEARXNG_PORT: '8888'
      SEARXNG_BIND_ADDRESS: 127.0.0.1
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    security_opt:
      - no-new-privileges:true

volumes:
  searxng-cache:
